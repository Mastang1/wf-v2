# Derived from vendor/wolfBoot/config/openocd/openocd_stm32f4.cfg.
# Uses scripts shipped with YOUR OpenOCD. No mass erase or option-byte writes.
source [find interface/stlink.cfg]
source [find target/stm32f4x.cfg]
adapter speed 1000
# Default works without NRST. If NRST is connected and firmware blocks SWD,
# replace the next line with: reset_config srst_only srst_nogate connect_assert_srst
reset_config none
bindto 127.0.0.1
$_TARGETNAME configure -event reset-init {
    mmw 0xe0042004 0x7 0x0
}
# No init/reset/halt here: caller or Cortex-Debug owns the launch sequence.
